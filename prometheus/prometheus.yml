global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: '3x-ui-modern'

scrape_configs:
  - job_name: '3x-ui-backend'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: '/metrics'
    
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
